<title>Chess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; touch-action: manipulation; }
#chatInput { font-size: 16px; }
body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button:disabled { cursor: default; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 38% 46%, transparent 52%, rgba(0, 0, 0, 0.55) 100%); }
.loading { position: fixed; inset: 0; z-index: 150; background: #0b0806; display: grid; place-items: center; pointer-events: none; font: italic 500 22px/1 var(--display); letter-spacing: 0.06em; color: var(--ink-3); transition: opacity 0.8s ease; }
.loading.gone { opacity: 0; visibility: hidden; transition: opacity 0.7s ease, visibility 0s linear 0.7s; }
.fatal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; width: min(420px, calc(100% - 32px)); margin: 0; padding: 20px 22px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--glass-2); color: var(--ink); font: 400 18px/1.45 var(--body); text-align: center; }

#ui { position: fixed; inset: 0; pointer-events: none; padding-left: var(--gl); padding-right: var(--gr); padding-block: var(--gt) var(--gb); }
#ui :is(button, input, .panel, .plate, .controls, .banner, .confirm, .card, .menu, .overlay, .col-body) { pointer-events: auto; }

.brand { position: absolute; top: calc(var(--gt) + 10px); left: calc(var(--gl) + 14px); white-space: nowrap; }
.brand span { margin: 0 0.45em; color: var(--ink-3); }
body.tight .brand, body.compact .brand { display: none; }

.plate { display: inline-flex; align-items: center; gap: 12px; min-height: 50px; padding: 8px 16px 8px 13px; transition: border-color 0.4s ease, box-shadow 0.4s ease; }
.plate.turn.black { border-color: rgba(214, 166, 94, 0.62); box-shadow: 0 0 22px rgba(214, 166, 94, 0.14); }
.plate.turn.white { border-color: rgba(207, 211, 217, 0.55); box-shadow: 0 0 22px rgba(207, 211, 217, 0.1); }
.plate-top { position: absolute; top: var(--gt); left: 0; right: var(--area-r); margin-inline: auto; width: max-content; max-width: calc(100% - 32px); }
.orb { width: 20px; height: 20px; flex: none; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #fff3d6 0, #e3b46a 34%, #8c5f26 78%, #4a3212 100%); box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.35); }
.orb.white { background: radial-gradient(circle at 34% 30%, #ffffff 0, #ccd1d8 36%, #6a717b 80%, #353a41 100%); }
.pwrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pname { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.picker-card { width: min(520px, 100%); }
.color-wheel-btn .cw-dot { width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(#ff3b3b, #ffb21e, #f4ef3a, #3fd16a, #2fc6e8, #3a66ff, #a64dff, #ff3fb4, #ff3b3b); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.35); }
.pick-neutrals { display: flex; gap: 10px; justify-content: center; width: 100%; }
.pick-neutrals .swatch { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35); }
.pick-tabs { width: 100%; }
.custom2d { margin-top: 14px; }
/* the quick colour wheel slides up as a half-height sheet, the board still in view above it */
.overlay.sheet { place-items: end center; padding: 0; background: transparent; }
.card.picker-card.quick { width: min(520px, 100%); max-height: 54%; gap: 10px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); }
.card.quick h2 { margin: 0; }
.card.quick .picker { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 14px; }
.card.quick .pick-tabs { grid-column: 1 / -1; }
.card.quick .pick-preview { display: none; }
.card.quick .pick-row, .card.quick .set-warn { grid-column: 1 / -1; }
.card.quick .pick-neutrals { display: grid; grid-template-columns: repeat(2, 34px); gap: 10px; justify-content: center; }
.card.quick .pick-hex { display: none; }
.card.quick .wheel-wrap { justify-self: center; max-width: 150px; }
.card.quick .end-actions { margin-top: 0; }
.picker { display: grid; grid-template-columns: 1fr 150px; gap: 14px; align-items: center; }
.wheel-wrap { position: relative; width: 100%; max-width: 240px; aspect-ratio: 1; touch-action: none; }
.wheel { width: 100%; height: 100%; border-radius: 50%; cursor: crosshair; display: block; }
.wheel-knob { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.6); pointer-events: none; }
.pick-side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pick-preview img { width: 150px; height: 150px; display: block; }
.pick-swatch { width: 100%; height: 14px; border-radius: 7px; }
.pick-hex { font: 500 13px/1 ui-monospace, Menlo, monospace; color: var(--ink-3); }
.pick-row { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; font: 400 15px/1 var(--body); color: var(--ink-2); }
.picker .set-warn { grid-column: 1 / -1; }
@media (max-width: 520px) { .picker { grid-template-columns: 1fr; justify-items: center; } }
.set-group { margin-bottom: 14px; }
.set-group .opt-label { margin: 0 0 7px; font: 500 15px/1.3 var(--body); color: var(--ink); }
.set-group .opt { padding: 10px 12px; }
.settings-card h2 { margin-bottom: 12px; }
.settings-card { max-height: min(86vh, 900px); overflow-y: auto; width: min(600px, 100%); padding-left: 28px; padding-right: 28px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 -5px 9px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.2); cursor: pointer; padding: 0; }
.swatch.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
.swatch.more { background: conic-gradient(#f33, #fc3, #3c6, #3cf, #36f, #c3f, #f33); color: #fff; font: 700 18px/1 var(--body); text-shadow: 0 1px 2px #000; }
#modeInstant, #modePreview, #btnHistory, .panel-head .vr { display: none !important; }
.chat-title { color: var(--ink); }
.panel-head .head-gap { flex: 1; }
body.compact .chat-close { display: none; }
.set-note { margin: 6px 0 0; font: italic 400 14px/1.35 var(--body); color: var(--ink-3); }
.set-warn { margin: 6px 0 0; font: 400 14px/1.35 var(--body); color: #e8b46a; }
.color-row { display: grid; grid-template-columns: 1fr 44px 96px; align-items: center; gap: 10px; margin: 6px 0; font: 400 15px/1.2 var(--body); color: var(--ink-2); }
.color-row input[type=color] { width: 44px; height: 34px; border: 1px solid var(--line-2); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
.color-row .hex { padding: 7px 9px; font: 500 14px/1 ui-monospace, Menlo, monospace; text-transform: uppercase; }
body.player-colors.player-colors .orb.white { background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--orbW) 45%, #fff) 0, var(--orbW) 45%, color-mix(in srgb, var(--orbW) 55%, #000) 100%); box-shadow: 0 0 0 1px rgba(255,255,255,0.3); }
body.player-colors.player-colors .orb:not(.white) { background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--orbB) 45%, #fff) 0, var(--orbB) 45%, color-mix(in srgb, var(--orbB) 55%, #000) 100%); box-shadow: 0 0 0 1px rgba(255,255,255,0.3); }
.pcap { display: flex; flex-wrap: wrap; align-items: center; max-width: 150px; padding-left: 2px; }
.pcap[hidden] { display: none; }
.pcap svg { display: block; margin-right: -5px; }
.ptag { font: 500 11px/1 var(--body); white-space: nowrap; }
.plate.turn.black .ptag { color: var(--gold-hi); }
.plate.turn.white .ptag { color: var(--silver); }
.live-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); }

.bottom-bar { position: absolute; left: var(--gl); right: calc(var(--area-r) + var(--gr)); bottom: var(--gb); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.mine { display: flex; align-items: center; gap: 10px; min-width: 0; }
.icon-btn.round { width: 44px; height: 44px; border-radius: 50%; background: rgba(13, 10, 8, 0.58); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.controls { display: flex; align-items: center; gap: 8px; }
.ctl { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 44px; height: 44px; padding: 0 15px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(13, 10, 8, 0.6); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--ink); font: 500 16px/1 var(--body); cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
.ctl:hover:not(:disabled) { border-color: var(--gold); }
.ctl:disabled { opacity: 0.4; cursor: default; }
.ctl.icon-only { padding: 0; width: 44px; }
.status { position: absolute; top: calc(var(--gt) + 62px); left: 0; right: var(--area-r); margin-inline: auto; width: max-content; max-width: calc(100% - 32px); border-radius: 999px; text-align: center; pointer-events: none; }
.status:empty { display: none; }

/* Notices over the board */
.banner { position: absolute; top: calc(var(--gt) + 100px); left: 0; right: var(--area-r); margin-inline: auto; width: max-content; max-width: calc(100% - 32px); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 9px 10px 9px 18px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--glass-2); font: 400 16px/1.35 var(--body); color: var(--ink); }
.banner-actions { display: flex; gap: 6px; align-items: center; }
.confirm { position: absolute; bottom: calc(var(--gb) + 76px); left: 0; right: var(--area-r); margin-inline: auto; width: max-content; max-width: calc(100% - 32px); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 9px 9px 9px 20px; border-radius: 14px; border: 1px solid rgba(214, 166, 94, 0.45); background: var(--glass-2); }
.san { font: 600 25px/1 var(--display); color: var(--gold-hi); margin-left: 4px; }
.toast { position: absolute; bottom: calc(var(--gb) + 140px); left: 0; right: var(--area-r); margin-inline: auto; width: max-content; max-width: calc(100% - 32px); opacity: 0; transform: translateY(6px); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease; }
.btn.gold { border-color: rgba(214, 166, 94, 0.62); }
.btn.quiet { border-color: transparent; }
.btn.quiet:hover { color: var(--ink); background: rgba(255, 255, 255, 0.05); }
.btn:disabled { opacity: 0.55; }
.icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { color: var(--ink); border-color: var(--line-2); }
.icon-btn.small { width: 34px; height: 34px; }

.panel { position: absolute; top: var(--gt); right: var(--gr); bottom: var(--gb); width: var(--panel-w); display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; }
body.focus:not(.compact) .panel { display: none; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; gap: 6px; }
.chip { cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease; }
.chip:hover { color: var(--ink); border-color: var(--line-2); }
.chip[aria-pressed="true"] { border-color: var(--gold); }
.vr { width: 1px; height: 26px; margin: 0 4px; background: var(--line-2); }
.head-gap { flex: 1; }
.sheet-close { display: none; }
.panel-body { position: relative; flex: 1; min-height: 0; }
.chat-list { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 18px 18px 10px; scrollbar-width: thin; scrollbar-color: rgba(239, 222, 196, 0.18) transparent; }
.chat-list[hidden] { display: none; }
.note { margin: auto 0; padding: 0 12px; text-align: center; font: italic 400 17px/1.45 var(--body); color: var(--ink-3); text-wrap: balance; }

.typing { min-height: 22px; padding: 0 18px 4px; font: italic 400 15px/22px var(--body); color: var(--ink-3); }
.chat-form { display: flex; }
.chat-form[hidden], .typing[hidden] { display: none; }
.chat-form input { flex: 1; min-width: 0; border: 1px solid var(--line-2); background: rgba(0, 0, 0, 0.25); color: var(--ink); font: 400 18px var(--body); }
.chat-form input::placeholder { color: var(--ink-3); }
.chat-form input:focus { outline: none; border-color: var(--gold); }
.send { flex: none; display: grid; place-items: center; border-radius: 50%; border: 0; cursor: pointer; }


/* Post-game timeline: same board, a focused review inspector on the right. */
.review-summary{padding:15px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:linear-gradient(145deg,#29292e,#17171a);margin:4px 0 12px;color:#f5f5f7;}
.review-kicker{display:flex;justify-content:space-between;align-items:center;gap:8px;font:750 11px/1.3 var(--body);letter-spacing:.13em;color:#d6d6db}
.review-counter{font:550 11px/1.3 var(--body);letter-spacing:0;color:#a7a7ae;text-align:right}
.review-track{width:100%;height:5px;overflow:hidden;border-radius:99px;background:#45454a;margin:12px 0 14px}
.review-progress{height:100%;background:linear-gradient(90deg,#ba8d4b,#f1cf80);border-radius:99px;transition:width .2s ease}
.review-event{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.review-event strong{font:700 18px/1.2 var(--display);letter-spacing:-.02em}
.review-san{font:650 15px/1.2 var(--body);color:#c6c6cc;font-variant-numeric:tabular-nums}
.review-event-event strong{color:#eacc76}
.review-event-mate strong{color:#f18c8c}
.review-detail{margin:9px 0 0;color:#c1c1c8;font:400 13px/1.55 var(--body)}
.review-stepper{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:10px 0}
.review-stepper>button{flex:0 0 auto;min-height:36px}
.review-play-button{min-width:88px}
.review-exit-button{flex:1 1 100%!important;margin-top:4px}
.review-move-scroll{max-height:min(34dvh,250px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:7px 6px;background:#111114}
.review-move-scroll .mv{min-height:33px}
.review-move-scroll .mv.on{background:rgba(232,189,84,.20);color:#f7d889;border-color:rgba(232,189,84,.48)}
.review-entry{margin:8px 0 14px;min-height:42px}

.review-analysis-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;
  padding:8px 2px;margin:4px 0 7px;color:#b9b9c0;
  font:550 11px/1.35 var(--body)}
.review-analysis-head>span:first-child{flex:1 1 100%;color:#d2d2d7}
.review-side-count{border:1px solid #414146;border-radius:999px;padding:4px 8px;
  color:#c9c9d0;background:#1f1f23;white-space:nowrap}
.review-insight{margin:7px 0 8px;padding:12px 13px;border-radius:12px;
  border:1px solid rgba(255,255,255,.11);background:#202024;color:#e7e7eb}
.review-insight-title{font:750 14px/1.3 var(--body);color:#e6e6ec}
.review-insight-best .review-insight-title{color:#a3d4ad}
.review-insight-inaccuracy{border-left:3px solid #d7c177}
.review-insight-mistake{border-left:3px solid #e7a560}
.review-insight-blunder{border-left:3px solid #e17276}
.review-insight-uncertain{border-left:3px solid #7e899c}
.review-insight-blunder .review-insight-title{color:#f2a0a4}
.review-insight-mistake .review-insight-title{color:#ecc086}
.review-teaching{margin:7px 0 0;font:400 12.5px/1.48 var(--body);color:#c8c8cd}
.review-cost{margin-top:8px;font:500 11px/1.35 var(--body);color:#acacb4}
.review-compare{display:block;width:100%;margin-top:10px;
  min-height:38px!important;border:1px solid #655647!important;
  background:#3b332c!important;color:#f4d7a8!important;font:650 12px/1.2 var(--body)!important}
.review-compare:hover{background:#4c4135!important}
.review-thinking,.review-engine-note{margin:5px 0 7px;color:#9898a2;
  font:400 11px/1.45 var(--body)}
.review-engine-note{margin:6px 0 10px}
.review-move-scroll .review-flag-inaccuracy{box-shadow:inset 3px 0 #cbb766;background:rgba(203,183,102,.08)}
.review-move-scroll .review-flag-mistake{box-shadow:inset 3px 0 #e6a25c;background:rgba(230,162,92,.10)}
.review-move-scroll .review-flag-blunder{box-shadow:inset 3px 0 #d76e74;background:rgba(215,110,116,.12)}
.review-move-scroll .review-flag-best{color:#b8d5c1}
.review-move-scroll .review-flag-strong{box-shadow:inset 3px 0 #30d158;background:rgba(48,209,88,.1);color:#c9f7d6}
.review-insight-strong{border-left:3px solid #30d158}
.review-insight-strong .review-insight-title{color:#a3e8b4}
.review-mode{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;margin:10px 0 2px;border-radius:12px;background:var(--fill-2)}
.review-mode .btn{min-height:32px;border-radius:9px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:600}
.review-mode .btn[aria-pressed="true"]{background:#636366;color:#fff}
.review-move-scroll .mv.on{font-weight:750}
body.compact .review-analysis-head{margin:3px 0 6px;padding:4px 0}
body.compact .review-insight{padding:10px 11px;margin:6px 0}

body.compact .review-summary{padding:11px 12px;margin:0 0 8px}
body.compact .review-detail{font-size:12px;line-height:1.4}
body.compact .review-move-scroll{max-height:18dvh}
@media(prefers-reduced-motion:reduce){.review-progress{transition:none}}

/* History */
.hist { position: absolute; inset: 0; overflow-y: auto; padding: 18px; scrollbar-width: thin; scrollbar-color: rgba(239, 222, 196, 0.18) transparent; }
.hist h3 { margin: 0; font: 500 24px/1.1 var(--display); color: var(--ink); }
.hist .sub { margin: 4px 0 14px; font: 400 15px/1.35 var(--body); color: var(--ink-3); }
.moves { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 1fr); gap: 2px 6px; font-variant-numeric: lining-nums tabular-nums; }
.moves .no { padding-right: 4px; text-align: right; font: 400 15px/34px var(--body); color: var(--ink-3); }
.mv { padding: 7px 9px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--ink-2); font: 500 17px/1.1 var(--body); text-align: left; cursor: pointer; }
.mv:hover { background: rgba(255, 255, 255, 0.05); color: var(--ink); }
.mv.on { border-color: var(--gold); }
.stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 6px; }
.section-title { margin: 22px 0 10px; font: 500 12px/1 var(--body); letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-3); }
.games { display: flex; flex-direction: column; gap: 8px; }
.muted { margin: 0; font: italic 400 16px/1.4 var(--body); color: var(--ink-3); }

.menu { position: fixed; z-index: 4; width: 236px; display: flex; flex-direction: column; }
.menu[hidden] { display: none; }
.menu button { padding: 11px 12px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; }
.menu button:hover { background: rgba(255, 255, 255, 0.06); }
.menu hr { margin: 6px 4px; border: 0; }
.menu p { margin: 6px 12px 8px; font: 400 16px/1.4 var(--body); color: var(--ink-2); }
.menu .row { display: flex; gap: 6px; padding: 0 4px 4px; }

.overlay { position: absolute; top: 0; bottom: 0; left: 0; right: var(--area-r); z-index: 3; display: grid; place-items: center; padding: 24px var(--gr) 24px var(--gl); }
.overlay[hidden] { display: none; }

.ctl, .icon-btn.round { border: 0; background: var(--mat); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--ink); font: 500 15px/1 var(--body); border-radius: 999px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25); }
.ctl:hover:not(:disabled) { background: rgba(58, 58, 60, 0.8); }
body.compact .bottom-bar .ctl, body.compact .bottom-bar .icon-btn.round { border: 0; border-radius: 50%; }
.fab, .exit-focus { border: 0; background: var(--acc); color: #fff; box-shadow: 0 8px 22px rgba(10, 132, 255, 0.35); }
.badge { background: #ff453a; color: #fff; font-family: var(--body); }

/* modal cards = iOS sheets */
.overlay { background: rgba(0, 0, 0, 0.42); }
.card { gap: 14px; padding: 26px 20px 20px; border-radius: 28px; border: 0; background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }
.card h2 { font: 700 28px/1.12 var(--display); letter-spacing: -0.025em; }
.card p { font: 400 16px/1.4 var(--body); color: var(--ink-2); }
.card.setup h2, .settings-card h2 { font-size: 24px; }
.card.picker-card.quick { border-radius: 28px 28px 0 0; }
.eyebrow, .opt-label{ margin-top: 6px; padding-left: 4px; font: 400 13px/1.2 var(--body); letter-spacing: 0; text-transform: uppercase; color: var(--ink-3); text-align: left; }
.card.quick h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }

/* segmented control for two-choice rows */
.opt-group:not(.stack):not(.four) { gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill-2); }
.opt-group:not(.stack):not(.four) .opt { min-height: 34px; justify-content: center; padding: 7px 10px; border-radius: 8px; background: transparent; font: 500 15px/1.2 var(--body); color: var(--ink); text-align: center; }
.opt-group:not(.stack):not(.four) .opt[aria-checked="true"] { background: #636366; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); color: #fff; }
.opt { border: 0; }
.opt[aria-checked="true"] { color: var(--ink); border-color: transparent; background: var(--acc-tint); }
.set-group .opt { font-size: 16px; }

/* buttons */
.btn { min-height: 50px; padding: 0 22px; border-radius: 14px; border: 0; background: var(--fill); color: var(--acc); font: 600 17px/1 var(--body); letter-spacing: -0.01em; }
.btn:hover { background: rgba(118, 118, 128, 0.32); }
.btn.gold { color: #fff; background: var(--acc); }
.btn.gold:hover { background: #2b95ff; }
.btn.quiet { background: none; color: var(--acc); font-weight: 400; }
.btn.small { min-height: 34px; padding: 0 14px; border-radius: 999px; font-size: 15px; }
.icon-btn { border: 0; border-radius: 50%; background: var(--fill); color: var(--ink-2); }
.end-actions { gap: 10px; }

/* fields */
 .chat-form input { border: 0; border-radius: 12px; background: var(--fill); color: var(--ink); font: 400 17px var(--body); }
.chat-form input { border-radius: 999px; height: 40px; padding: 0 16px; }
.chat-form input:focus{ outline: none; box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.55); }
.send { width: 40px; height: 40px; background: var(--acc); color: #fff; }
.send:disabled { filter: grayscale(0.7) brightness(0.7); background: var(--fill); color: var(--ink-3); }
.chat-form { gap: 8px; padding: 8px 12px 10px; border-top: 0.5px solid var(--line-2); align-items: center; }

/* Compact, readable chat state rather than oversized italic overlay text. */
.chat-list>.chat-empty-state{
  align-self:center;flex:none;width:min(100%,320px);max-width:calc(100% - 12px);
  margin:auto;padding:22px 18px;border:1px solid rgba(255,255,255,.13);
  border-radius:16px;background:#222225;text-align:center;font-style:normal;
  box-shadow:0 8px 24px #0004;pointer-events:none;
}
.chat-empty-title{display:block;margin:0 0 8px;color:#f2f2f5;
  font:650 16px/1.25 var(--body);letter-spacing:-.025em}
.chat-empty-description{margin:0;color:#aaaab1;font:400 13px/1.55 var(--body)}
@media(max-width:600px){
  body.compact .chat-list{padding:14px 12px;min-height:0}
  body.compact .chat-list>.chat-empty-state{padding:14px 12px;border-radius:13px}
}
/* chat = Messages */
.panel { border: 0; background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
body.compact .panel { border-radius: 22px 22px 0 0; background: var(--mat-thick); box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4); }
.panel-head { padding: 10px 12px; border-bottom: 0.5px solid var(--line-2); }
.chat-title { font: 600 17px/1.2 var(--display); letter-spacing: -0.02em; text-transform: none; }
.chip { border: 0; border-radius: 999px; padding: 8px 13px; background: var(--fill-2); color: var(--ink); font: 500 15px/1 var(--body); }
.chip[aria-pressed="true"] { color: #fff; background: var(--acc); }

/* menus = iOS context menu */
.menu { border: 0; border-radius: 14px; padding: 6px; background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); }
.menu button { border-radius: 9px; font: 400 17px/1.2 var(--body); }
.menu hr { border-top: 0.5px solid var(--line-2); }
.menu p { font-size: 15px; }

/* toasts, banners, lists */
.toast { border: 0; border-radius: 999px; padding: 11px 18px; background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--ink); font: 500 15px/1.3 var(--body); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
.banner, .confirm{ border: 0; border-radius: 18px; background: var(--mat-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); font-family: var(--body); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); } .san, .moves, .mv { font-family: var(--body); }
.mv.on { background: var(--acc); color: #fff; }
.promo { border: 0; background: var(--fill-2); }
.section-title, .hist h3 { font-family: var(--display); letter-spacing: -0.02em; text-transform: none; }

.eyebrow { padding-left: 0; text-align: center; font-size: 12px; }
body.compact .bottom-bar { padding: 4px; border-radius: 999px; background: var(--mat); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); align-items: center; }
body.compact .bottom-bar .ctl, body.compact .bottom-bar .icon-btn.round { background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
body.compact .bottom-bar .ctl:hover:not(:disabled) { background: var(--fill-2); }

/* iOS typing: isolate the 2D board from the reflowing chat sheet.
   Its pixel geometry is stable even if the native keyboard pans the viewport. */
body.compact.chat2d.chat-keyboard:not(.landscape) #board2d:not([hidden]){
 display:block!important;position:fixed!important;inset:0 auto auto 0!important;
 width:100%!important;height:var(--chat-viewport-height,100vh)!important;
 padding:0!important;margin:0!important;overflow:visible!important;pointer-events:none
}
body.compact.chat2d.chat-keyboard:not(.landscape) #board2d .b2svg{
 position:absolute!important;flex:none!important;
 left:var(--chat-board-left,0px)!important;top:var(--chat-board-top,0px)!important;
 width:var(--chat-board-width,280px)!important;height:var(--chat-board-height,327px)!important;
 min-width:0!important;max-width:none!important;max-height:none!important;
 margin:0!important;transform:none!important;transform-origin:top left!important;
 transition:none!important;pointer-events:auto
}
body.compact.chat2d.chat-keyboard:not(.landscape) .panel{
 position:fixed!important;left:0!important;right:0!important;top:auto!important;
 bottom:var(--chat-keyboard-bottom,0px)!important;
 height:64px!important;min-height:64px!important;max-height:64px!important;
 padding-bottom:0!important;margin:0!important;
 border-radius:14px 14px 0 0!important;transform:none!important;transition:none!important;
 z-index:45;background:rgba(24,24,26,.98)!important;box-shadow:0 -6px 20px #000a!important
}

body.compact.chat-keyboard .typing,

body.compact.chat-keyboard .chat-form{

 padding:9px 10px;align-items:center;margin:0;box-sizing:border-box;border-top:0!important
}

/* Player identity HUD: the selected piece colour belongs to each player,
   while the separate White/Black subtitle is always the actual chess side.
   Turn state lives in this single plate instead of stacked floating badges. */
#plateTop,#plateBottom{
  --plate-ring:#7d7d82;
  border:1.5px solid var(--plate-ring)!important;
  background:rgba(22,22,25,.92)!important;
  box-shadow:0 6px 22px #0009!important;
  overflow:hidden;
  isolation:isolate;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
#plateTop .pwrap,#plateBottom .pwrap{min-width:0;overflow:hidden;gap:4px}
#plateTop .pname,#plateBottom .pname{
  color:#f8f8fa!important;white-space:nowrap;text-overflow:ellipsis;
  overflow:hidden;min-width:0;max-width:100%;
}
#plateTop .ptag,#plateBottom .ptag{
  display:block!important;color:#b8b8bf!important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0;font-weight:500;line-height:1.25;
}
#plateTop .ptag[hidden],#plateBottom .ptag[hidden]{display:none!important}
#plateTop .plate-turn-hint,#plateBottom .plate-turn-hint{
  color:var(--plate-ring,#c8c8ce);font-weight:650;
}
#plateTop .orb,#plateBottom .orb{
  background:radial-gradient(circle at 29% 24%,
    color-mix(in srgb,var(--plate-accent,#888) 47%,white),
    var(--plate-accent,#888) 46%,
    color-mix(in srgb,var(--plate-accent,#888) 62%,black))!important;
  box-shadow:inset 0 0 0 1px #ffffff25,inset 0 -2px 4px #0008;
}
#plateTop.turn,#plateBottom.turn{
  border-color:var(--plate-ring)!important;outline:0!important;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--plate-ring) 27%,transparent),
    0 8px 24px #0009!important;
}
#plateTop:not(.turn),#plateBottom:not(.turn){
  border-color:color-mix(in srgb,var(--plate-ring) 72%,#39393f)!important;
}
/* Keep normal turn status available to assistive technology, not on the board.
   Notices are the only separate statuses worth consuming board space. */
#status:not(.notice){
  position:absolute!important;width:1px!important;height:1px!important;
  padding:0!important;overflow:hidden!important;
  clip-path:inset(50%)!important;white-space:nowrap!important;
  border:0!important;box-shadow:none!important;
}

body.compact.chat2d #status.notice{display:none!important}

}

  background:#252529;border:1px solid #56565d;
  box-shadow:0 5px 20px #0008;font-size:12px;
}

    if (piece && piece.color === actingSide()) { actionable = true; hp = pieceAt(sq); }
    if (selected && legalFrom(selected).some((m) => m.to === sq)) { actionable = true; tgt = sq; hp = null; }
  }
  canvas.style.cursor = actionable ? 'pointer' : '';
  if (hp !== hoverPiece) {
    if (hoverPiece && hoverPiece.sq !== selected) setPieceHighlight(hoverPiece, false);
    hoverPiece = hp;
    if (hp) setPieceHighlight(hp, true);
    requestRender();
  }
  if (tgt !== hoverSq) { hoverSq = tgt; updateMarkers(); }
}

/* ------------------------------------------------------------------ review */
function startReview(r) {
  stopReviewPlayback(false);
  reviewMovesExpanded = false;
  if (pending) cancelPreview(false);
  clearSelection();
  const ply = clamp(r.ply, 0, r.moves.length);
  const actions=r.actions||(r.live&&G.onlineProvider==='supabase'?(G.clockActions||[]):[]);
  review = { ...r, actions, ply, pos: positionFrom(r.moves,ply,actions), alternative: false };
  syncBoard(review.pos, { animate: true, quick: true });
  hide($('endCard'));
  updateAll();
  startTeachingAnalysis();
}
function reviewTo(ply, auto = false) {
  if (!auto) stopReviewPlayback(false);
  if (!review) {
    if (ply >= G.moves.length || !G.moves.length) return;
    startReview({ moves: G.moves.slice(), ply, title: `Game ${G.n}`, live: true });
    return;
  }
  const p = clamp(ply, 0, review.moves.length);
  if (p === review.ply && !review.alternative) return;
  const wasAlternative = review.alternative;
  const forward = !wasAlternative && p === review.ply + 1;
  review.ply = p; review.alternative = false;
  review.pos = positionFrom(review.moves,p,review.actions||[]);
  window.ChessReviewAnalyzer?.focus(p);
  const land = syncBoard(review.pos, { animate: true, quick: !forward, hint: forward ? review.pos.last : null });
  if (forward) fxForMove(review.pos.last, land, false);
  updateAll();
}
let reviewKeyOnly = store.get('sg.reviewKeys', true) !== false;
function reviewStep(d, auto = false) {
  const at = review ? review.ply : G.moves.length;
  if (review && reviewKeyOnly && !auto) {
    const A = window.ChessReviewAnalyzer, keys = A?.keyMoments?.() || [], st = A?.status?.();
    const target = d > 0 ? keys.find((p) => p > at) : [...keys].reverse().find((p) => p < at);
    if (target != null) { reviewTo(target, auto); return; }
    /* nothing left to stop on: go to the end (or the start), unless analysis is still filling in */
    if (st && st.complete) { reviewTo(d > 0 ? review.moves.length : 0, auto); return; }
  }
  reviewTo(at + d, auto);
}
function stopReviewPlayback(render = true) {
  if (!reviewTimer) return;
  clearInterval(reviewTimer);
  reviewTimer = null;
  if (render && historyOpen) renderHistory();
}
function toggleReviewPlayback() {
  if (!review) return;
  if (reviewTimer) { stopReviewPlayback(); return; }
  if (review.ply >= review.moves.length) reviewTo(0);
  if (!review.moves.length) return;
  reviewTimer = setInterval(() => {
    if (!review || review.ply >= review.moves.length) { stopReviewPlayback(); return; }
    reviewStep(1, true);
    if (review && review.ply >= review.moves.length) stopReviewPlayback();
  }, 1350);
  renderHistory();
}
function reviewComment(pos) {
  if (!pos.last) return { label: 'Starting position', detail: 'Both sides begin with their full armies. Follow each move using Next or Play.', kind: 'start' };
  const mv = pos.last, piece = PIECE[mv.piece] || 'piece', who = SIDE[mv.color];
  if (pos.chess.isCheckmate()) return { label: 'Checkmate', detail: who + ' delivers checkmate with ' + mv.san + '. The opposing king has no legal escape.', kind: 'mate' };
  if (mv.promotion) return { label: 'Promotion', detail: who + ' promotes a pawn on ' + mv.to + ' to a ' + (PIECE[mv.promotion] || 'piece') + '.', kind: 'event' };
  if (pos.chess.inCheck()) return { label: 'Check', detail: who + ' plays ' + mv.san + ', putting the opposing king in check.', kind: 'event' };
  if (mv.flags && /[kq]/.test(mv.flags)) return { label: 'Castling', detail: who + ' castles ' + (mv.flags.includes('k') ? 'kingside' : 'queenside') + ', moving the king and rook together.', kind: 'event' };
  if (mv.captured) return { label: 'Capture', detail: who + ' captures a ' + (PIECE[mv.captured] || 'piece') + ' on ' + mv.to + ' with a ' + piece + '.', kind: 'event' };
  return { label: 'Move played', detail: who + ' moves the ' + piece + ' from ' + mv.from + ' to ' + mv.to + '.', kind: 'normal' };
}

/* Both sides are analysed from their own point of view, before each actual move.
   These are limited-depth estimates, not claims of perfect or exhaustive chess play. */
function startTeachingAnalysis() {
  const analyzer = window.ChessReviewAnalyzer;
  if (!review || !analyzer) return;
  if(review.actions?.length){analyzer.stop();return;}
  const engineText = $('engineSrc')?.textContent;
  if (!engineText) return;
  try {
    const chess = new Chess(), steps = [];
    for (const move of review.moves) {
      if (!UCI.test(move)) throw new Error('Invalid historical move');
      steps.push({ fen: chess.fen(), move });
      chess.move({ from:move.slice(0, 2), to:move.slice(2, 4),
        ...(move.length === 5 ? { promotion:move[4] } : {}) });
    }
    analyzer.start(steps, engineText, () => {
      if (review && historyOpen) renderHistory();
    });
    analyzer.focus(review.ply);
  } catch (_) {
    // Move playback remains available even if a historical game cannot be analysed.
    analyzer.stop();
  }
}
function teachingBest(ply) {
  if (!review || ply < 1) return null;
  const r = window.ChessReviewAnalyzer?.get(ply);
  if (!r || !r.move || r.move === r.played) return null;
  try {
    const chess = positionFrom(review.moves, ply - 1).chess;
    const spec = { from:r.move.slice(0, 2), to:r.move.slice(2, 4) };
    if (r.move[4]) spec.promotion = r.move[4];
    const move = chess.move(spec);
    if (!move) return null;
    let why;
    if (chess.isCheckmate()) why = 'This delivers checkmate immediately.';
    else if (move.promotion) why = 'This promotes a pawn to a stronger piece.';
    else if (chess.inCheck()) why = 'This puts the opposing king in check.';
    else if (move.captured) why = 'This captures the opposing ' + (PIECE[move.captured] || 'piece') + '.';
    else if (/[kq]/.test(move.flags || '')) why = 'This castles and moves the king to a safer square.';
    else why = 'This keeps a stronger position in the engine’s search. Try the alternative on the board and compare.';
    return { ...r, san:move.san, why, who:ply % 2 === 1 ? 'White' : 'Black' };
  } catch (_) { return null; }
}
function toggleTeachingMove() {
  if (!review || !review.ply) return;
  stopReviewPlayback(false);
  if (review.alternative) {
    review.alternative = false;
    review.pos = positionFrom(review.moves, review.ply);
  } else {
    const suggestion = teachingBest(review.ply);
    if (!suggestion) return;
    const alternate = review.moves.slice(0, review.ply - 1).concat(suggestion.move);
    const pos = positionFrom(alternate);
    if (pos.ply !== review.ply) return;
    review.pos = pos;
    review.alternative = true;
  }
  const land = syncBoard(review.pos, { animate: true, quick: false, hint: review.pos.last });
  if (review.alternative) fxForMove(review.pos.last, land, false);
  updateAll();
}

function beginGameReview() {
  if (!G.moves.length) return;
  if (focusMode && !compact) setFocus(false);
  if (!historyOpen) openHistory(true);
  if (compact) setSheet(true);
  startReview({ moves: G.moves.slice(), ply: 0, title: G.mode === 'cpu' ? 'Versus computer' : 'Game ' + G.n, live: true });
}
document.addEventListener('keydown', (e) => {
  if (!review || e.altKey || e.ctrlKey || e.metaKey || e.target?.closest?.('input, textarea, select, [contenteditable="true"]')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); reviewStep(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); reviewStep(-1); }
  if (e.code === 'Space' && !e.target?.closest?.('button, a')) { e.preventDefault(); toggleReviewPlayback(); }
});
function endReview() {
  stopReviewPlayback(false);
  window.ChessReviewAnalyzer?.stop();
  if (!review) return;
  review = null;
  syncBoard(G.pos, { animate: true, quick: true });
  updateAll();
  maybeShowEndCard();
}

function renderHistory() {

  frag.append(h, sub);
  if (review) {
    const pos = review.pos, total = review.moves.length;

    const verdict = window.ChessReviewAnalyzer?.get(review.ply);
    const note = review.alternative && best
      ? {label:'Suggested alternative',detail:best.who + ' could have played ' + best.san + '. ' + best.why,kind:'event'}
      : reviewComment(pos);
    const summary = el('section', 'review-summary');
    summary.setAttribute('aria-label', 'Game replay');
    const kicker = el('div', 'review-kicker');
    kicker.textContent = 'MOVE ' + review.ply + ' OF ' + total;
    const counter = el('span', 'review-counter');

    kicker.append(counter);
    const track = el('div', 'review-track'), progress = el('div', 'review-progress');
    progress.style.width = (total ? 100 * review.ply / total : 0) + '%';
    track.append(progress);
    const badge = el('div', 'review-event review-event-' + note.kind);
    const headline = el('strong');
    headline.textContent = note.label;
    const san = el('span', 'review-san');
    san.textContent = review.ply ? (review.alternative ? 'Suggested move' : 'Actual move') : 'Opening';
    badge.append(headline, san);
    const explanation = el('p', 'review-detail');
    explanation.textContent = note.detail;
    summary.append(kicker, track);
    // Engine coaching replaces generic piece movement explanations when available.
    if (!verdict || review.alternative || review.ply === 0) summary.append(badge, explanation);
    frag.append(summary);
    const analyzer = window.ChessReviewAnalyzer;
    const engineState = analyzer?.status();
    let engineHead = null;
    if (engineState) {

      line.textContent = engineState.error || (engineState.complete

      const counts = analyzer.counts();
      for (const side of ['w', 'b']) {
        const n = counts[side], missed = n.inaccuracy + n.mistake + n.blunder;
        const item = el('span', 'review-side-count');
        item.textContent = (side === 'w' ? 'White' : 'Black') + ': ' + missed + ' flagged';
        engineHead.append(item);
      }
    }
    if (review.ply && verdict) {
      const who = review.ply % 2 === 1 ? 'White' : 'Black';
      const relative = (G.mode === 'cpu' ? cpu.human : G.mode === 'live' ? mySeat : null);
      const actor = relative ? (relative === (review.ply % 2 === 1 ? 'w' : 'b') ? 'Your move' : "Opponent's move") : who + ' move';
      const insight = el('section', 'review-insight review-insight-' + verdict.kind);
      const title = el('div', 'review-insight-title');
      title.textContent = actor + ' · ' + verdict.label;
      insight.append(title);
      if (best && ['inaccuracy','mistake','blunder','uncertain'].includes(verdict.kind)) {
        const actualSan = sans[review.ply - 1] || review.moves[review.ply - 1];
        const text = el('p', 'review-teaching');
        let lesson = 'Played ' + actualSan + '. ' + best.san +
          ' was stronger in this search. ';
        if (verdict.label === 'Allowed checkmate') {

            best.san + ' avoids that mating threat in the engine search.';

        } else {

          const next = review.ply < review.moves.length
            ? positionFrom(review.moves, review.ply + 1).last : null;
          if (next && next.color !== (review.ply % 2 === 1 ? 'w' : 'b')) {
            if (next.captured && verdict.kind !== 'uncertain') {
              lesson += 'Next, ' + SIDE[next.color] + ' played ' + next.san +
                ' and took a ' + SIDE[review.ply % 2 === 1 ? 'w' : 'b'].toLowerCase() + ' ' +
                (PIECE[next.captured] || 'piece') + '.';
            } else if (next.san?.endsWith('#')) {
              lesson += ' The opponent followed with ' + next.san + ', checkmate.';
            }
          }
        }
        text.textContent = lesson;
        insight.append(text);
        if (verdict.kind !== 'uncertain' && Number.isFinite(verdict.loss) && verdict.loss < 90000) {

        insight.append(p);

    } else if (review.ply && engineState?.busy) {

    if (engineState) {

        }

function sansFor(moves, actions) {
  const out = [];

    const p = positionFrom(moves, i, actions);
    try { out.push(new Chess(p.chess.fen()).move({ from: moves[i].slice(0, 2), to: moves[i].slice(2, 4), promotion: moves[i][4] || undefined }).san); }

  if (!api || !uid) { toast('Sign in to save games.'); return; }

  try {

const DRAW_TITLE = { stalemate: 'Stalemate — Draw', 'insufficient material': 'Draw — Insufficient Material', 'threefold repetition': 'Draw — Threefold Repetition', 'the fifty-move rule': 'Draw — Fifty-Move Rule', agreement: 'Draw — Agreed' };
function describeResult() {
  if (G.reason === 'replaced') return {title:'Game ended',line:'A player started a new game. This match has been closed.'};
  const winner = G.result === '1-0' ? 'w' : G.result === '0-1' ? 'b' : null;

  let line = '';

  else if (G.mode === 'live') line = `${seatName(winner)} wins with ${SIDE[winner]}.`;

/* lifetime record vs the computer, kept on this device */
function recordCpuResult() {
  if (G.mode !== 'cpu' || G.status !== 'over' || !G.result || !G.moves.length) return;
  const rec = store.get('chess.cpuRecord', { w: 0, l: 0, d: 0, last: '' });
  const k = endKey();
  if (rec.last === k) return;
  rec.last = k;
  if (G.result === '1/2-1/2') rec.d++;
  else if ((G.result === '1-0') === (cpu.human === 'w')) rec.w++;
  else rec.l++;
  /* per level, plus a short log of recent games (positions after every move) for the stats screen */
  const outcome = G.result === '1/2-1/2' ? 'd' : (G.result === '1-0') === (cpu.human === 'w') ? 'w' : 'l';
  rec.levels = rec.levels || {}; const lv = rec.levels[cpu.level] || (rec.levels[cpu.level] = { w: 0, l: 0, d: 0 }); lv[outcome]++;
  store.set('chess.cpuRecord', rec);
  try {
    const fens = []; for (let i = 0; i <= G.moves.length; i++) fens.push(positionFrom(G.moves, i, G.clockActions || []).chess.fen());
    const log = store.get('chess.cpuGames', []);
    log.push({ id: k, level: cpu.level, color: cpu.human, result: outcome, reason: G.reason || '', fens, at: Date.now() });
    store.set('chess.cpuGames', log.slice(-80));

/* One-time cleanup: computer games resigned in the first 3 moves never count. */
(() => {
  if (store.get('chess.cpuEarlyScrub', false)) return;
  const log = store.get('chess.cpuGames', []), rec = store.get('chess.cpuRecord', null);
  const early = (Array.isArray(log) ? log : []).filter((g) => g.reason === 'resignation' && Array.isArray(g.fens) && g.fens.length - 1 <= 6);
  if (early.length && rec) {
    for (const g of early) {
      if (rec[g.result] > 0) rec[g.result]--;
      const lv = rec.levels?.[g.level]; if (lv && lv[g.result] > 0) lv[g.result]--;
    }
    store.set('chess.cpuRecord', rec);
    store.set('chess.cpuGames', log.filter((g) => !early.includes(g)));
  }
  store.set('chess.cpuEarlyScrub', true);
})();

async function applyPawnTimeAction(kind,square){
  const clock=window.ChessClock?.snapshot();
  if(!clock||G.status!=='active'||G.onlineBusy)return;
  if(!['10m','12m','15m'].includes(clock.mode))return;
  if(G.onlineProvider==='supabase'){
    if(!mySeat){toast('Spectators cannot choose pawns.');return;}
    G.onlineBusy=true;
    try {await window.familyChessPawnAction(G.gid,kind,square);}
    catch(e){toast(e?.message||'Could not trade the pawn',4500);}
    finally{G.onlineBusy=false;updateAll();}
    return;
  }
  if(kind==='penalty'&&clock.clockState!=='penalty')return;
  if(kind==='sacrifice'&&
    ((clock.clockState!=='running'&&clock.clockState!=='decision')||
      window.ChessClock.remaining(clock.turn)>30000))return;
  const victim=kind==='penalty'?clock.penaltySide:clock.turn;
  if(victim!=='w'&&victim!=='b')return;
  const before=new Chess(G.pos.chess.fen());
  if(square!==null){
    const piece=before.get(square);
    if(!piece||piece.type!=='p'||piece.color!==victim){toast('Choose a valid pawn.');return;}
    if(kind==='sacrifice'&&before.inCheck()){
      toast('Escape check before trading a pawn.');return;
    }
    before.remove(square);
    if(kind==='sacrifice'&&before.inCheck()){
      toast('That pawn is protecting your king.');return;
    }
  }else if(kind!=='penalty'||pawnCandidates(victim).length){toast('Choose a pawn.');return;}
  const bits=before.fen().split(' ');
  bits[3]='-';bits[4]='0';
  if(kind==='sacrifice'){
    bits[1]=victim==='w'?'b':'w';
    if(victim==='b')bits[5]=String(Number(bits[5])+1);
  }
  const fen=bits.join(' ');
  try{new Chess(fen);}catch{toast('That pawn cannot be removed safely.');return;}
  const action={id:Date.now()+Math.random(),after_ply:G.moves.length,
    kind:kind==='penalty'&&!square?'waiver':kind,square,fen_after:fen};
  const actions=[...(G.clockActions||[]),action];
  const updated=positionFrom(G.moves,G.moves.length,actions);
  if(updated.invalid||updated.chess.fen()!==fen){toast('Could not apply pawn choice.');return;}
  if(kind==='sacrifice')window.ChessClock.endDecision?.();
  const applied=kind==='penalty'?window.ChessClock.resolveLocalPenalty():
    window.ChessClock.sacrificeLocal(updated.chess.turn(),G.moves.length);
  if(!applied)return;
  G.clockActions=actions;G.pos=updated;G.version++;
  clearSelection();syncBoard(updated,{animate:true,quick:true});
  updateAll();renderChat();
  toast(kind==='penalty'?'Pawn removed · three minutes restored':
    'Pawn forfeited · 1:30 added to your next turn',2800);
  if(G.mode==='cpu'&&updated.chess.turn()!==cpu.human)
    setTimeout(requestComputer,250);
}

  renderChat();
  openPregame();
  goLocal('Practice against the computer, or use Online games to invite someone to play online.'); initProgress();
  requestRender();
}

/* ------------------------------------------------------------------ opening: choose a side by swiping the board
   The board starts side-on (White on the left, Black on the right). Dragging turns it like a lazy Susan;
   let go past the threshold and it swings round to that side and the game starts. */
const PG = { lean: null, on: false, az: Math.PI / 2, target: Math.PI / 2, polar: 0.98, dist: 0, swing: false, swingDur: 950, drag: null, glide: null };
const PG_BASE = Math.PI / 2;
function pregameReserve() {
  const H = window.innerHeight, top = $('pregame').querySelector('.pg-top').getBoundingClientRect().bottom;
  const card = $('pgBottom').getBoundingClientRect();
  /* leave a strip above the card for the swipe hint */
  return { top: Math.max(top + 10, 110), bottom: H - card.top + 40 };
}
function pgSetLevel(v) {
  v = clamp(Math.round(Number(v)) || 2, 1, 5);
  cpu.level = v; store.set('sg.level', v);
  const r = $('pgLevel'); r.value = String(v); r.style.setProperty('--pg-fill', ((v - 1) / 4 * 100) + '%');
  $('pgLevelName').textContent = `Level ${v}`;
  $('pgTicks').querySelectorAll('span').forEach((t, i) => t.classList.toggle('on', i + 1 === v));
}
function openPregame() {
  /* the chooser is a 3D moment: close the chat sheet and leave the flat board first */
  if (sheetOpen) setSheet(false);
  if (VIEW === '2d') applyView('3d', false);
  PG.on = true; PG.swing = false; PG.az = PG_BASE; PG.polar = compact && window.innerWidth < window.innerHeight ? 0.8 : 0.86; /* higher camera: the board fills the space and reads clearly side-on */
  document.body.classList.add('pregame');
  const el = $('pregame'); el.classList.remove('leaving', 'touched'); el.hidden = false;
  pgSetLevel(cpu.level);
  controls.enabled = false;
  userCam = false;
  if (camTween) { tweens.delete(camTween); camTween = null; }
  PG.target = PG.az; PG.lean = null;
  $('pgWhite').classList.remove('lean'); $('pgBlack').classList.remove('lean');
  pgMeasure();
  pgLean(true);
  /* plain white and black armies (and button dots) while choosing: re-tint now, the game's colours were already on */
  applySideColors(true); if (VIEW === '2d') draw2D(true);
  if (!firstFrame) pregameGlide();
}
/* the board turns at one fixed distance (the farther of side-on and end-on), so it never breathes in and out as it
   rotates; the projection and centring are set once by fitCamera */
function pgMeasure() {
  let far = 0;
  for (const a of [0, PG_BASE]) { PG.az = a; fitCamera(false); far = Math.max(far, camera.position.length()); }
  PG.dist = far * 1.02; /* a touch of room so corners stay clear mid-turn */
  const hint = $('pgHint'); if (hint) hint.style.top = Math.round($('pgBottom').getBoundingClientRect().top - 52) + 'px'; PG.az = PG.target; pgPlace();
}
function pgPlace() {
  const d = PG.dist, p = PG.polar, a = PG.az;
  camera.position.set(Math.sin(p) * Math.sin(a) * d, Math.cos(p) * d, Math.sin(p) * Math.cos(a) * d);
  camera.lookAt(0, 0, 0); controls.target.set(0, 0, 0);
  requestRender();
}
/* which army you are turning toward you (White when the camera swings toward az 0, Black toward π) */
function pgLean(force) {
  /* colours stay put while you choose; lean is kept only for the button highlight */
  const t = PG.drag ? PG.target : PG_BASE;
  const lean = t < PG_BASE - 0.14 ? 'w' : t > PG_BASE + 0.14 ? 'b' : null;
  if (lean !== PG.lean) { $('pgWhite').classList.toggle('lean', lean === 'w'); $('pgBlack').classList.toggle('lean', lean === 'b'); }
  if (lean === PG.lean && !force) return;
  PG.lean = lean;
}
/* called every animation frame: the board eases toward where your finger is, so uneven touch events
   (and 60 vs 120 Hz screens) still give one continuous motion */
let pgLast = 0;
function pgStep(now) {
  if (!PG.on) { pgLast = 0; return false; }
  const dt = pgLast ? Math.min(0.05, (now - pgLast) / 1000) : 1 / 60; pgLast = now;
  const diff = PG.target - PG.az;
  if (Math.abs(diff) < 1e-4) { if (diff) { PG.az = PG.target; pgPlace(); } return false; }
  PG.az += diff * (1 - Math.exp(-dt * (PG.drag ? 26 : 9)));
  pgPlace();
  pgLean();
  return true;
}
function pregameGlide() {
  if (REDUCED || !PG.on) return;
  /* a slow quarter-glide in from a wider angle: shows the board can turn, and settles before you touch it */
  PG.az = PG_BASE - 0.42; pgPlace();
  PG.target = PG_BASE;
}
function closePregame(side) {
  if (!PG.on) return;
  PG.on = false; PG.swing = true;
  controls.enabled = true;
  const el = $('pregame'); el.classList.add('leaving');
  document.body.classList.remove('pregame');
  setTimeout(() => { el.hidden = true; el.classList.remove('leaving', 'dragging'); }, 460);
  if (side) {
    store.set('sg.side', side);
    startComputerGame(side, cpu.level, 1250);
  } else fitCamera(true);
  setTimeout(() => { PG.swing = false; }, PG.swingDur + 150);
}
/* Leaving a game against the computer (or a two-player game on this screen) for a new game ends it for good:
   the engine stops thinking, the clock stops, and nothing from it carries into the next game. */
function endPracticeGame() {
  if (G.onlineProvider === 'supabase' || (G.mode !== 'cpu' && G.mode !== 'local')) return;
  cancelComputer();
  window.ChessClock?.stopLocal();
  if (pending) cancelPreview(false);
  stopReviewPlayback(false); window.ChessReviewAnalyzer?.stop(); review = null;
  if (G.status === 'active') { G.status = 'over'; G.reason = 'abandoned'; G.result = null; G.version++; }
  endDismissed = endKey(); hide($('endCard'));
}
/* leaving the chooser without picking (an online match opened, or the lobby took over) */
function dismissPregame() { if (PG.on) closePregame(null); }
{
  const el = $('pregame');
  const azFor = (dx) => clamp(PG_BASE - (dx / Math.max(320, window.innerWidth)) * Math.PI * 1.05, 0.02, Math.PI - 0.02);
  el.addEventListener('pointerdown', (e) => {
    if (!PG.on || e.target.closest('.pg-bottom')) return;
    $('pregame').classList.add('touched');
    PG.drag = { id: e.pointerId, x: e.clientX - (PG_BASE - PG.target) / (Math.PI * 1.05) * Math.max(320, window.innerWidth), t: performance.now(), lx: e.clientX, lt: performance.now(), v: 0, va: 0, lx0: e.clientX };
    el.setPointerCapture(e.pointerId); el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    const d = PG.drag; if (!d || e.pointerId !== d.id) return;
    const now = performance.now(), dt = Math.max(1, now - d.lt);
    d.v = 0.7 * d.v + 0.3 * ((e.clientX - d.lx) / dt); d.lx = e.clientX; d.lt = now;
    const t = azFor(e.clientX - d.x);
    d.va = 0.7 * d.va + 0.3 * ((t - PG.target) / dt); PG.target = t;
  });
  const end = (e) => {
    const d = PG.drag; if (!d || e.pointerId !== d.id) return;
    PG.drag = null; el.classList.remove('dragging');
    const dx = e.clientX - d.lx0;
    /* a decisive swipe (distance or flick speed) picks a side; a small nudge springs back */
    /* the side the board was turned to when you let go wins; a quick flick from near the middle also counts */
    const at = PG.target < PG_BASE - 0.12 ? 'w' : PG.target > PG_BASE + 0.12 ? 'b' : null;
    const pick = Math.abs(dx) > 48 ? at : Math.abs(d.v) > 0.45 ? (d.v > 0 ? 'w' : 'b') : null;
    if (pick && e.type !== 'pointercancel') {
      /* match the swing to the flick: angle left to travel / speed, with easeOut's 3x opening slope */
      const goal = pick === 'w' ? 0 : Math.PI, left = Math.abs(goal - PG.az), speed = Math.abs(d.va);
      PG.swingDur = clamp(speed > 0.0005 ? (3 * left) / speed : 950, 560, 1050);
      closePregame(pick); return;
    }
    PG.target = PG_BASE; /* a nudge eases back */
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  $('pgWhite').addEventListener('click', () => closePregame('w'));
  $('pgBlack').addEventListener('click', () => closePregame('b'));
  $('pgLevel').addEventListener('input', (e) => pgSetLevel(e.target.value));
  window.addEventListener('keydown', (e) => {
    if (!PG.on || e.target.closest?.('input, textarea, select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); closePregame('w'); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); closePregame('b'); }
  });
  window.addEventListener('resize', () => { if (PG.on) pgMeasure(); });
}

/* Supabase match bridge: reuse the original 3D/2D board and chess.js engine. */
const familyChessBoot = boot();
window.familyChessNative = {
  async present(game, moves, userId, labels = {}, sharedColors = {}, options = {}) {
    await familyChessBoot;
    if (!game || !Array.isArray(moves) || typeof userId !== 'string') throw new Error('Invalid online game');
    endPracticeGame();
    dismissPregame();
    const isPlayer=game.white_player_id===userId||game.black_player_id===userId;
    const watching=options.spectating===true;
    if(!isPlayer&&!watching)throw new Error('You are not a player in this match');
    if(watching&&(!game.black_player_id||!['active','finished'].includes(game.status)))
      throw new Error('This match is not open for spectators');
    const actions=Array.isArray(options.actions)?options.actions:[];
    const pos = positionFrom(moves,moves.length,actions);
    if (pos.invalid || pos.ply !== moves.length || pos.chess.fen() !== game.current_fen)
      throw new Error('Online position mismatch. Refresh the match.');
    const sameGame = G.onlineProvider === 'supabase' && G.gid === game.id;
    const sameMoves = sameGame && G.moves.length === moves.length && G.moves.every((m,i) => m === moves[i]);
    const oldActions=G.clockActions||[];
    const sameActions=sameGame&&oldActions.length===actions.length&&
      oldActions.every((item,i)=>String(item.id)===String(actions[i].id));
    const boardChanged=!sameActions||G.pos?.chess?.fen()!==pos.chess.fen();
    const extension = sameGame && sameActions && G.moves.length + 1 === moves.length && G.moves.every((m,i) => m === moves[i]);
    const wasOver = G.status === 'over';
    const priorSeat = mySeat;
    const oldColors=JSON.stringify(G.colors||{});
    const filteredColors={};
    for(const [uid,hex] of Object.entries(sharedColors||{})){
      if(typeof uid==='string'&&chromaOk(hex))filteredColors[uid]=hex.toLowerCase();
    }
    const colorsChanged=oldColors!==JSON.stringify(filteredColors);
    cancelComputer();
    me.id = userId;
    me.canWrite = !watching;
    const white = game.white_player_id, black = game.black_player_id;
    G.mode = 'live'; G.onlineProvider = 'supabase'; G.gid = game.id;
    G.n = 1; G.seats = {w:white,b:black}; G.colors=filteredColors;
    G.names = {w:white ? (labels[white] || 'White') : 'Waiting to join',b:black ? (labels[black] || 'Black') : ''};
    G.status = game.status === 'finished' ? 'over' : game.status;
    G.result = game.result || null;
    G.reason = G.status === 'over' ?
      (game.end_reason==='replaced'?'replaced':game.end_reason==='resignation'?'resignation':
       game.end_reason==='timeout'?'timeout':
       pos.chess.isCheckmate()?'checkmate':
       pos.chess.isStalemate()?'stalemate':pos.chess.isInsufficientMaterial()?'insufficient material':
       pos.chess.isThreefoldRepetition()?'threefold repetition':'the fifty-move rule') : null;
    G.drawOffer = null; G.startedAt = new Date(game.created_at || Date.now()).getTime();
    G.turnAt = new Date(game.updated_at || Date.now()).getTime();
    G.moves = moves.slice(); G.clockActions=actions.slice(); G.pos = pos;
    G.resumePlies = Number(game.resumed_plies) || 0;
    mySeat = watching ? null : white === userId ? 'w' : 'b';
    window.ChessClock?.showOnline(game,pos.chess.turn(),
      watching?null:window.familyChessClaimTimeout);
    const label = document.querySelector('.auth-practice');
    if(label)label.textContent=watching?'Spectating · '+G.names.w+' vs '+G.names.b:
      'Online · '+(mySeat==='w'?'White':'Black');
    const seatChanged = priorSeat !== mySeat || !sameGame;
    if (seatChanged) {stopReviewPlayback(false); window.ChessReviewAnalyzer?.stop(); flipped = false; review = null; pending = null; selected = null; lockUntil = 0;}
    const desired = wantedSide();
    const sideChanged = desired !== viewSide;
    if (sideChanged) viewSide = desired;
    if(colorsChanged){
      applySideColors(true);
      if(VIEW==='2d')draw2D(true);
    }
    if (seatChanged || !sameMoves || sideChanged || boardChanged) {
      G.version++;
      if (pending) cancelPreview(false);
      clearSelection();
      if (!review) {
        if (seatChanged || sideChanged) {
          syncBoard(pos,{animate:false,quick:true}); userCam = false; fitCamera(true);
        } else if (extension) {
          const land = syncBoard(pos,{animate:true,hint:pos.last});
          fxForMove(pos.last,land,!!pos.last && pos.last.color !== mySeat);
        } else syncBoard(pos,{animate:true,quick:true});
      }
      draw2D(true);
    }
    updateAll();
    if(game.clock_state==='penalty' && mySeat &&
       mySeat!==game.clock_penalty_side){
      const penaltyKey=game.id+':'+game.updated_at;
      if(lastPenaltyPrompt!==penaltyKey){
        lastPenaltyPrompt=penaltyKey;
        setTimeout(()=>{if(G.gid===game.id&&
          window.ChessClock?.snapshot?.().clockState==='penalty')
            promptPawnTimeChoice('penalty');},450);
      }
    }
    // The original practice renderer initializes before Supabase connects.
    // Refresh the empty/chat state as soon as a private match is displayed.
    renderChat();
    if (G.status === 'over' && !wasOver) setTimeout(() => maybeShowEndCard(), REDUCED ? 0 : 600);
    return {mySeat,turn:pos.chess.turn(),status:G.status};
  },
  openReview() {
    if (G.status !== 'over' || !G.moves.length) return false;
    endDismissed = endKey();
    beginGameReview();
    return true;
  },
  activateColorProfile(id){activateChessColorProfile(id);},
  clearColorProfile(){clearChessColorProfile();},
  getAccountColor(){return myColor();},
  setAccountColor(hex){
    if(!chromaOk(hex))return;
    rememberPieceColor('mine',hex);
    applySideColors(true);updatePlates();
    if(VIEW==='2d')draw2D(true);
  },
  endPractice() { endPracticeGame(); },
  leaveToPractice() {
    if (G.onlineProvider !== 'supabase') return;
    /* back from an online match: a fresh board and the side chooser, never the old computer game */
    resetLocalGame('local',1);
    openPregame();
    renderChat();
    updateChatEnabled();
  }
};
window.dispatchEvent(new Event('familyChessNativeReady'));

/* iPhone installed web apps can otherwise magnify the PAGE when two rapid
   taps confirm a move. The chess renderer uses pointerup, not synthetic click,
   so cancelling only the second single-finger touchend preserves both taps.
   The 2D/3D board's own pinch-and-drag controls remain unchanged. */
for (const surface of [document.getElementById('stage'), document.getElementById('board2d')]) {
  if (!surface) continue;
  let lastTap = null;
  surface.addEventListener('touchend', (e) => {
    if (e.touches.length !== 0 || e.changedTouches.length !== 1) {
      lastTap = null;
      return;
    }
    const t = e.changedTouches[0], now = performance.now();
    const rapid = lastTap && now - lastTap.time < 360 &&
      Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) < 55;
    lastTap = {time: now, x: t.clientX, y: t.clientY};
    if (rapid && e.cancelable) e.preventDefault();
  }, {passive:false});
}
/* Keep the board's own double-click actions but suppress browser zoom. */
document.addEventListener('dblclick', (e) => {
  if (e.target instanceof Element && e.target.closest('#stage, #board2d')) e.preventDefault();
}, {capture:true, passive:false});
</script>

  setTimeout(function () {
    if (window.__sgBooted) return;
    var f = document.getElementById('fatal');
    if (f) { f.textContent = "The 3D board didn't load. Check your connection, then reload the page."; f.hidden = false; }
    var l = document.getElementById('loading');
    if (l) l.classList.add('gone');
  }, 15000);
</script>

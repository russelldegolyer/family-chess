name: Family Chess verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check external JavaScript syntax
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Test shared player colors and mobile chat layout
        run: node --test tests/*.test.mjs
